<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Schönberger Haustechnik – Vorher / Nachher (Entwurf)</title><style>
:root{--g:#0f1216;--p:#181d24;--r:#2a313b;--t:#e8ecf1;--s:#93a0ae;--a:#e2483d}*{box-sizing:border-box}body{margin:0;background:var(--g);color:var(--t);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--r);display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}h1{font-size:18px;margin:0}header p{margin:0;color:var(--s);font-size:13px}
.tabs{display:flex;gap:6px}button{background:var(--p);color:var(--t);border:1px solid var(--r);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:var(--a);border-color:var(--a)}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px;height:calc(100vh - 74px)}section{display:flex;flex-direction:column;min-height:0;background:var(--p);border:1px solid var(--r);border-radius:10px;overflow:hidden}
section h2{margin:0;padding:8px 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--r)}section h2 span{color:var(--s);text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px}
.bild{overflow:auto;flex:1}.bild img{width:100%;display:block}iframe{flex:1;border:0;width:100%;background:#fff}
@media(max-width:800px){main{grid-template-columns:1fr;height:auto}section{height:85vh}main[data-zeige=vorher] .nach,main[data-zeige=nachher] .vor{display:none}}
@media(min-width:801px){.tabs{display:none}}</style></head><body>
<header><div><h1>Schönberger Haustechnik – Vorher / Nachher</h1><p>Entwurf zur Ansicht von Thomas Klampfer – keine offizielle Seite der Firma.</p></div>
<div class="tabs"><button aria-pressed="true" data-z="vorher">Vorher</button><button aria-pressed="false" data-z="nachher">Nachher</button></div></header>
<main data-zeige="vorher"><section class="vor"><h2>Vorher <span>www.schoenberger-haustechnik.at</span></h2><div class="bild"><picture><source media="(max-width:800px)" srcset="vorher/vorbild-handy.jpg"><img src="vorher/vorbild-desk.jpg" alt="Bisherige Webseite (Bildschirmfoto)"></picture></div></section>
<section class="nach"><h2>Nachher <span><a href="index.html" style="color:#7fb2ff">neue Seite im ganzen Fenster öffnen</a></span></h2><iframe src="index.html" title="Neuer Entwurf"></iframe></section></main>
<script>document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelector("main").dataset.zeige=b.dataset.z;document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b))})</script></body></html>
